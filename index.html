<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.container{max-width:1050px;margin:0 auto;padding:55px 24px 70px}
header{text-align:center;margin:15px 0 48px}
h1{font-size:42px;letter-spacing:-1.5px;margin:0 0 10px;font-weight:700}
.subtitle{color:#777;font-size:14px}
.search{max-width:620px;margin:28px auto 0;position:relative}
.search input{width:100%;height:52px;border:1px solid #ddd;border-radius:14px;padding:0 18px;font-size:15px;outline:none;transition:.2s}
.search input:focus{border-color:#111;box-shadow:0 0 0 3px #eee}
.section{margin:38px 0}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid #e7e7e7;border-radius:13px;text-decoration:none;color:#111;background:#fff;transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);border-color:#bbb;box-shadow:0 7px 22px rgba(0,0,0,.07)}
.icon{width:34px;height:34px;border-radius:9px;background:#f2f2f2;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.name{font-size:14px;font-weight:600}.url{font-size:11px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{display:none;text-align:center;color:#888;padding:40px}
footer{text-align:center;color:#aaa;font-size:12px;margin-top:65px}
@media(max-width:600px){.container{padding:35px 16px 50px}h1{font-size:34px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px}.name{font-size:13px}.url{display:none}}
</style>
</head>
<body>
<main class="container">
<header>
<h1>MY LINKS</h1>
<div class="subtitle">我的个人互联网导航</div>
<div class="search"><input id="search" type="search" placeholder="搜索我的网站..." autocomplete="off"></div>
</header>

<section class="section" data-section>
<div class="section-title">🤖 AI</div>
<div class="grid">
<a class="card" data-name="ChatGPT" href="https://chatgpt.com/" target="_blank" rel="noopener"><span class="icon">AI</span><span><div class="name">ChatGPT</div><div class="url">chatgpt.com</div></span></a>
</div></section>

<section class="section" data-section>
<div class="section-title">📚 学习 / 知识</div>
<div class="grid">
<a class="card" data-name="知乎" href="https://www.zhihu.com/" target="_blank" rel="noopener"><span class="icon">知</span><span><div class="name">知乎</div><div class="url">zhihu.com</div></span></a>
</div></section>

<section class="section" data-section>
<div class="section-title">🛠️ 工具 / 资源</div>
<div class="grid">
<a class="card" data-name="小众技术工具库" href="https://www.xiaozhongjishu.com/" target="_blank" rel="noopener"><span class="icon">小</span><span><div class="name">小众技术工具库</div><div class="url">xiaozhongjishu.com</div></span></a>
</div></section>

<section class="section" data-section>
<div class="section-title">📝 备忘 / 笔记</div>
<div class="grid">
<a class="card" data-name="iCloud 备忘录" href="https://www.icloud.com.cn/notes/note/UHJpdmF0ZTo6Tm90ZXM6OmN1cnJlbnRVc2VyOjoxNjI3ZDRiMi05NGRhLTQ3NzUtYmM1Yi0yNGQ3NmI0ZGJlYzg=" target="_blank" rel="noopener"><span class="icon">☑</span><span><div class="name">iCloud 备忘录</div><div class="url">icloud.com.cn</div></span></a>
</div></section>

<section class="section" data-section>
<div class="section-title">🗺️ 地图 / 出行</div>
<div class="grid">
<a class="card" data-name="高德地图" href="https://ditu.amap.com/" target="_blank" rel="noopener"><span class="icon">地</span><span><div class="name">高德地图</div><div class="url">ditu.amap.com</div></span></a>
</div></section>

<section class="section" data-section>
<div class="section-title">🎬 影视 / 娱乐</div>
<div class="grid">
<a class="card" data-name="YouTube 电影" href="https://www.youtube.com/feed/storefront" target="_blank" rel="noopener"><span class="icon">▶</span><span><div class="name">YouTube 电影</div><div class="url">youtube.com</div></span></a>
<a class="card" data-name="哔哩哔哩 Bilibili" href="https://www.bilibili.com/" target="_blank" rel="noopener"><span class="icon">哔</span><span><div class="name">哔哩哔哩</div><div class="url">bilibili.com</div></span></a>
</div></section>

<section class="section" data-section>
<div class="section-title">🌐 社交 / 信息</div>
<div class="grid">
<a class="card" data-name="X" href="https://x.com/home" target="_blank" rel="noopener"><span class="icon">𝕏</span><span><div class="name">X</div><div class="url">x.com</div></span></a>
</div></section>

<div id="empty" class="empty">没有找到匹配的网站</div>
<footer>My Links · 2026</footer>
</main>
<script>
const input=document.getElementById('search'), empty=document.getElementById('empty');
input.addEventListener('input',()=>{
 const q=input.value.trim().toLowerCase(); let visible=0;
 document.querySelectorAll('[data-section]').forEach(s=>{
   let count=0;
   s.querySelectorAll('.card').forEach(c=>{
     const ok=!q || c.dataset.name.toLowerCase().includes(q);
     c.style.display=ok?'flex':'none'; if(ok){count++;visible++}
   });
   s.style.display=count?'block':'none';
 });
 empty.style.display=visible?'none':'block';
});
</script>
</body>
</html>
